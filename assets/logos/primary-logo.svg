<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      :root {
        --bg-shadow: rgba(0, 0, 0, 0.25);
        --tag-string: #6B21A8;
        --gloss-opacity: 0.25;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-shadow: rgba(0, 0, 0, 0.6);
          --tag-string: #A855F7;
          --gloss-opacity: 0.35;
        }
      }
    </style>

    <!-- Main Bag Gradient -->
    <linearGradient id="bagGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="45%" stop-color="#7E22CE"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="handleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#7E22CE"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>

    <!-- Tag Gradient -->
    <linearGradient id="tagGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>

    <!-- Top Surface Gloss Highlight -->
    <linearGradient id="glossGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="var(--bg-shadow)"/>
    </filter>

    <filter id="groundShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ground Contact Shadow -->
  <ellipse cx="250" cy="415" rx="110" ry="12" fill="var(--bg-shadow)" filter="blur(6px)"/>

  <!-- Logo Group -->
  <g filter="url(#dropShadow)">
    
    <!-- Handle -->
    <path d="M 195,190 A 55,55 0 0,1 305,190" 
          fill="none" 
          stroke="url(#handleGradient)" 
          stroke-width="26" 
          stroke-linecap="round"/>

    <!-- Handle Inner Shadow Highlight -->
    <path d="M 195,190 A 55,55 0 0,1 305,190" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="3" 
          stroke-linecap="round" 
          opacity="0.3"/>

    <!-- Tag String/Ring -->
    <path d="M 335,225 C 365,235 375,255 370,270" 
          fill="none" 
          stroke="var(--tag-string)" 
          stroke-width="5" 
          stroke-linecap="round"/>

    <!-- Price Tag -->
    <g transform="rotate(32 375 270)">
      <path d="M 355,245 L 390,245 A 10,10 0 0,1 397,248 L 420,275 A 10,10 0 0,1 420,289 L 395,314 A 10,10 0 0,1 381,314 L 355,288 A 10,10 0 0,1 352,281 L 352,252 A 7,7 0 0,1 355,245 Z" 
            fill="url(#tagGradient)"/>
      <!-- Tag Hole -->
      <circle cx="367" cy="262" r="6" fill="#1E064A" opacity="0.6"/>
      <circle cx="367" cy="262" r="5" fill="#12032B"/>
    </g>

    <!-- Main Shopping Bag Body -->
    <path d="M 170,175 
             L 330,175 
             C 348,175 358,187 362,203 
             L 380,355 
             C 383,375 370,388 350,388 
             L 150,388 
             C 130,388 117,375 120,355 
             L 138,203 
             C 142,187 152,175 170,175 Z" 
          fill="url(#bagGradient)"/>

    <!-- Top Gloss Overlay -->
    <path d="M 170,175 
             L 330,175 
             C 348,175 358,187 362,203 
             L 371,280 
             C 270,260 230,310 129,280 
             L 138,203 
             C 142,187 152,175 170,175 Z" 
          fill="url(#glossGradient)" 
          opacity="var(--gloss-opacity)"/>

    <!-- Front Letter 'D' Cutout/Graphic -->
    <path d="M 198,225 
             L 248,225 
             C 285,225 308,245 308,280 
             C 308,315 285,335 248,335 
             L 198,335 
             Z 
             M 224,250 
             L 224,310 
             L 246,310 
             C 268,310 281,298 281,280 
             C 281,262 268,250 246,250 
             Z" 
          fill="#FFFFFF" 
          fill-rule="evenodd"/>

  </g>
</svg>
